services:
  user_postgres:
    image: postgres:16
    container_name: user_postgres
    environment:
      POSTGRES_DB: chatapp_user
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpass123
    ports:
      - "54321:5432"
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatuser -d chatapp_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chat-network

  chat_postgres:
    image: postgres:16
    container_name: chat_postgres
    environment:
      POSTGRES_DB: chatapp_chat
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpass123
    ports:
      - "54322:5432"
    volumes:
      - chat_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U chatuser -d chatapp_chat" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chat-network

  redis:
    image: redis:7-alpine
    container_name: chat_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - chat-network

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    volumes:
      - minio_data:/data
    networks:
      - chat-network

  user_service:
    build: 
      context: ./user-service
    container_name: user_service
    depends_on:
      user_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8081:8081"
      - "9091:9091"
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - chat-network

  chat_service:
    build:
      context: ./chat-service
    container_name: chat_service
    depends_on:
      chat_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8082:8082"
      - "9092:9092"
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - chat-network

  # api-gateway:
  #   build: ./api-gateway
  #   container_name: api_gateway
  #   depends_on:
  #     user_service:
  #       condition: service_healthy
  #     chat_service:
  #       condition: service_healthy
  #   env_file:
  #     - .env
  #   ports:
  #     - "8080:8080"
  #   networks:
  #     - chat-network

volumes:
  user_postgres_data:
  chat_postgres_data:
  redis_data:
  minio_data:

networks:
  chat-network:
    driver: bridge